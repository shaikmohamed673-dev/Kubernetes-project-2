# Local Kubernetes cluster that runs INSIDE Docker (kind = "Kubernetes IN Docker")
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # NodePort of the frontend Service
        hostPort: 8080         # open http://localhost:8080
        protocol: TCP
