# Needs an Ingress controller installed (e.g. ingress-nginx).
# Then switch the frontend Service to type ClusterIP and use a real domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: three-tier
spec:
  ingressClassName: nginx
  rules:
    - host: 3tier.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
