apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
  namespace: three-tier
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS messages (
      id SERIAL PRIMARY KEY,
      text TEXT NOT NULL,
      created_at TIMESTAMP DEFAULT NOW()
    );
    INSERT INTO messages (text) VALUES ('Hello from PostgreSQL on Kubernetes (Tier 3)!');
