# WARNING: placeholder values for learning. For real projects do NOT commit real
# passwords: create the secret with `kubectl create secret generic ...`
# or use Sealed Secrets / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: three-tier
type: Opaque
stringData:
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: change_me_strong_password
  POSTGRES_DB: appdb
